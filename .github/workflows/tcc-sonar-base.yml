name: TCC SonarQube base
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar-base:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - name: Checkout experimental base
        uses: actions/checkout@v4
        with:
          ref: 15b2215acfb08d77402ac4a41f0be358ca4e5afd
          fetch-depth: 0
      - name: Verify source revision
        run: |
          test "$(git rev-parse HEAD)" = "15b2215acfb08d77402ac4a41f0be358ca4e5afd"
          echo "BASE_SHA=$(git rev-parse HEAD)"
          echo "WORKFLOW_SHA=$GITHUB_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build JVM
        run: |
          set -o pipefail
          java -version 2>&1 | tee jdk-version.log
          ./mvnw -version 2>&1 | tee maven-version.log
          ./mvnw -B -ntp -Dmaven.test.skip=true package 2>&1 | tee build.log
      - name: Analyze with SonarScanner for Maven
        run: |
          set -o pipefail
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=MiqueiasBento_yourmenu-serverless \
            -Dsonar.organization=miqueiasbento \
            -Dsonar.scm.revision=15b2215acfb08d77402ac4a41f0be358ca4e5afd \
            -Dsonar.projectVersion=tcc-base \
            2>&1 | tee sonar.log
      - name: Export SonarQube results
        if: success()
        run: |
          mkdir -p sonar-export
          for attempt in $(seq 1 20); do
            curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/project_analyses/search?project=MiqueiasBento_yourmenu-serverless&ps=3" -o sonar-export/analyses.json
            if grep -q '15b2215acfb08d77402ac4a41f0be358ca4e5afd' sonar-export/analyses.json; then break; fi
            sleep 6
          done
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/measures/component?component=MiqueiasBento_yourmenu-serverless&metricKeys=ncloc,classes,functions,complexity,cognitive_complexity,duplicated_lines,duplicated_lines_density,code_smells,sqale_index" -o sonar-export/measures.json
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/measures/component_tree?component=MiqueiasBento_yourmenu-serverless&metricKeys=ncloc,classes,functions,complexity,cognitive_complexity,duplicated_lines,duplicated_lines_density,code_smells,sqale_index&qualifiers=FIL,DIR&ps=500" -o sonar-export/component-tree.json
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=MiqueiasBento_yourmenu-serverless&ps=500" -o sonar-export/issues.json
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualityprofiles/search?project=MiqueiasBento_yourmenu-serverless" -o sonar-export/quality-profiles.json
      - name: Preserve SonarQube exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-sonar-export
          path: sonar-export/
          if-no-files-found: ignore
      - name: Preserve execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-sonar-base-logs
          path: |
            jdk-version.log
            maven-version.log
            build.log
            sonar.log
          if-no-files-found: ignore
