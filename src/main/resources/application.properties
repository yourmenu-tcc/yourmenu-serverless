quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}

%dev.quarkus.datasource.devservices.enabled=false

%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true
%dev.quarkus.hibernate-orm.sql-load-script=no-file

%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.log.sql=false

smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}

mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}

mp.jwt.verify.issuer=comandas-api

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Sistema de Comandas API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST para gerenciamento de comandas de bar/restaurante

quarkus.http.port=8080

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

quarkus.native.resources.includes=**/*.sql
